<!-- ============================================================
     APERIA ANALYTICAL CHARTS: READY-TO-PASTE HTML SNIPPETS
     Add the word `charts` to the assemble marker so charts/styles.css is
     injected after base/styles.css. Every SVG example below uses the
     shared 640x300 chart frame documented at the top of charts.css:
       plot origin (44,16), plot size 576x250, baseline y=266, right edge x=620
       gridline y-values: 266, 203.5, 141, 78.5, 16  (0/25/50/75/100% of axis max)
     Recompute point positions for your own data with the formulas in that
     file's header comment, never eyeball pixel values.
     One group per file: trend, compare, proportion, intensity.
     ============================================================ -->

<!-- ==========================================================
     INTENSITY AND PROGRESS
     A value read as strength rather than as a length. Both need their number stated
     in text: color alone is not decodable.
     ========================================================== -->

<!-- ========== Heatmap ========== -->
<!-- Intensity across two categorical axes. Ships a legend and a title per cell. -->
<!-- Two categorical axes (here: time bucket x day of week), one value per
     cell. Cell background is a single hue at varying opacity (never a
     rainbow scale, that isn't in the palette), so pair it with the legend
     bar AND a <title> per cell: color alone is not accessible or printable. -->

    <div class="hm-colhead">Mon</div><div class="hm-colhead">Tue</div><div class="hm-colhead">Wed</div>

<!-- ========== Radial Gauge ========== -->
<!-- One number against a target. Fill color is a status token. -->
<!-- ONE value on a semicircular arc, never a categorical breakdown, that is
     what makes this different from a pie/donut, which stay off-limits.
     pathLength="100" on both arcs lets stroke-dasharray be read directly as
     a percentage: dasharray="{value},100". Status color follows the same
     three tokens the milestone timelines use (ahead/risk/done); pick the one
     that matches what the number means, not just "high = red". -->
<div class="gauge-card">
  <svg viewBox="0 0 200 120" width="200" height="120" role="img" aria-label="Composite risk score, 72 out of 100">
    <path class="gauge-track" pathLength="100" d="M20,100 A80,80 0 0 1 180,100"/>
    <path class="gauge-fill risk" pathLength="100" stroke-dasharray="72,100" d="M20,100 A80,80 0 0 1 180,100"/>
    <text class="gauge-val" x="100" y="92" text-anchor="middle">72</text>
    <text class="gauge-end" x="14" y="112" text-anchor="start">0</text>
    <text class="gauge-end" x="186" y="112" text-anchor="end">100</text>
  </svg>
  <div class="gauge-lbl">Composite Risk Score</div>
  <div class="gauge-sub">Above the 65 review threshold</div>
</div>
